version: "3"

tasks:
  run:
    - go run ./main.go -f1 -d, tests/testdata/fourchords.csv | head -n5

  run-lb:
    - go run ./cmd/lb

  run-be:
    - go run ./cmd/be

  run-curl:
    - curl http://127.0.0.1/ --output -

  lint:
    - golangci-lint fmt
    - golangci-lint run --enable-only tagalign,whitespace,nlreturn --fix
    - golangci-lint run

  test:
    - go test ./... -v
